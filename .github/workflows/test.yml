name: CI

on:
  pull_request:
  push:
    paths-ignore:
    - '**.md'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs_version:
          - 29.1
          - 29.3
          - 29.4
          - 30.1
          - 30.2
          - 31.1
        experimental: [false]
        include:
          - emacs_version: snapshot
            os: ubuntu-latest
            experimental: true
          - emacs_version: snapshot
            os: macos-latest
            experimental: true
          # Windows is best-effort: this config is Unix-centric
          # (exec-path-from-shell, term hooks, etc.).
          - emacs_version: 31.1
            os: windows-latest
            experimental: true

    steps:
    - uses: purcell/setup-emacs@master
      if: matrix.os != 'windows-latest'
      with:
        version: ${{ matrix.emacs_version }}

    - name: Install Emacs (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        choco install emacs -y --version=${{ matrix.emacs_version == 'snapshot' && '31.1' || matrix.emacs_version }}
        echo "C:\Program Files\Emacs\emacs-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - uses: actions/checkout@v7
    - name: Check startup
      shell: bash
      run: ./test-startup.sh
